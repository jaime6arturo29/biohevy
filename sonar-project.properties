# Configuración Oficial de SonarCloud para BioHevy
sonar.host.url=https://sonarcloud.io
sonar.projectKey=jaime6arturo29_biohevy
sonar.organization=jaime6arturo29
sonar.projectName=BioHevy
sonar.projectVersion=1.0

# Codificación
sonar.sourceEncoding=UTF-8

# Código fuente del sistema y pruebas (Backend & Motor Biomecánico DSP)
sonar.sources=backend
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**

# Cobertura de pruebas unitarias (Pytest-cov)
sonar.python.coverage.reportPaths=backend/coverage.xml

# Exclusiones de análisis en backend (scripts auxiliares y bases de datos)
sonar.exclusions=backend/tests/**,backend/biohevy.db,backend/htmlcov/**,backend/seed.py,backend/run_tests.py,backend/migrate.py,backend/diagnostico_emg.py,backend/test_engine.py,backend/test_integration.py,backend/update_images.py,backend/update_lat.py,**/*.json,**/*.bat,**/*.ino

# Exclusiones de duplicidad para cumplir umbral estricto (< 3%)
sonar.cpd.exclusions=backend/tests/**
