# Configuración Oficial de SonarCloud para BioHevy
sonar.host.url=https://sonarcloud.io
sonar.projectKey=jaime6arturo29_biohevy
sonar.organization=jaime6arturo29
sonar.projectName=BioHevy
sonar.projectVersion=1.0

# Codificación
sonar.sourceEncoding=UTF-8

# Código fuente del sistema a auditar (Backend & Motor Biomecánico DSP)
sonar.sources=backend
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**

# Cobertura de pruebas unitarias (Pytest-cov)
sonar.python.coverage.reportPaths=backend/coverage.xml

# Exclusiones exhaustivas para backend y proyecto raíz
sonar.exclusions=biohevy-web/**,frontend/**,firmware_esp32/**,backend/tests/**,backend/seed.py,backend/run_tests.py,backend/migrate.py,backend/diagnostico_emg.py,backend/test_engine.py,backend/test_integration.py,backend/update_images.py,backend/update_lat.py,backend/biohevy.db,backend/htmlcov/**,tests/**,seed.py,run_tests.py,migrate.py,diagnostico_emg.py,test_engine.py,test_integration.py,update_images.py,update_lat.py,biohevy.db,htmlcov/**,**/*.json,**/*.bat,**/*.ino,**/*.db,**/*.html,**/__pycache__/**

# Exclusiones de duplicidad para cumplir umbral estricto (< 3%)
sonar.cpd.exclusions=biohevy-web/**,frontend/**,backend/tests/**,backend/seed.py,tests/**,seed.py
