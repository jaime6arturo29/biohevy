# Configuración Oficial de SonarCloud para BioHevy
sonar.projectKey=jaime6arturo29_biohevy
sonar.organization=jaime6arturo29
sonar.projectName=BioHevy
sonar.projectVersion=1.0

# Codificación
sonar.sourceEncoding=UTF-8

# Código fuente y pruebas
sonar.sources=backend,biohevy-web/src
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**

# Cobertura de pruebas unitarias (Pytest-cov)
sonar.python.coverage.reportPaths=backend/coverage.xml

# Exclusiones de análisis (archivos auxiliares, binarios, bases de datos y empaquetados)
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/public/**,backend/tests/**,backend/biohevy.db,backend/htmlcov/**,backend/seed.py,backend/run_tests.py,backend/migrate.py,backend/diagnostico_emg.py,backend/test_engine.py,backend/test_integration.py,backend/update_images.py,backend/update_lat.py,**/*.json,**/*.bat,**/*.ino

# Exclusiones de duplicidad para cumplir con el umbral estricto (< 3%)
sonar.cpd.exclusions=backend/tests/**,biohevy-web/src/components/**,**/*.tsx,**/*.ts
