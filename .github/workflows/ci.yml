name: CI / Quality Gate Pipeline (BioHevy)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  quality-gate:
    name: Pruebas Automatizadas y SonarCloud Quality Gate
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código con historial completo para SonarCloud
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar entorno Python
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Instalar dependencias del Backend y Testing
      - name: Instalar Dependencias de Backend y Testing
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy numpy scipy python-dotenv pydantic pytest pytest-cov httpx

      # 4. Ejecutar Suite de Pruebas de Pytest y generar cobertura XML
      - name: Ejecutar Pruebas Automatizadas con Cobertura
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest backend/tests --cov=backend --cov-config=backend/.coveragerc --cov-report=xml:backend/coverage.xml --cov-report=term-missing -v

      # 5. Configurar Node.js para auditoría de Frontend
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: biohevy-web/package-lock.json

      # 6. Auditoría estática de Frontend (ESLint)
      - name: Ejecutar Linting Frontend
        run: |
          cd biohevy-web
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run lint || true
          cd ..

      # 7. Escaneo estático en SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 8. Verificación de Aprobación de Quality Gate
      - name: Validar SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
