name: CI / Quality Gate Pipeline (BioHevy)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gate:
    name: Pruebas Automatizadas y SonarCloud Quality Gate
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código con historial completo para SonarCloud
      - name: Checkout del Repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # 2. Configurar entorno Python
      - name: Configurar Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements-ci.txt

      # 3. Instalar dependencias fijadas (solo wheels binarios, sin scripts de setup)
      - name: Instalar Dependencias de Backend y Testing
        run: |
          python -m pip install --only-binary :all: -r backend/requirements-ci.txt

      # 4. Ejecutar Suite de Pruebas de Pytest y generar cobertura XML
      - name: Ejecutar Pruebas Automatizadas con Cobertura
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest backend/tests --cov=backend --cov-config=backend/.coveragerc --cov-report=xml:backend/coverage.xml --cov-report=term-missing -v

      # 5. Escaneo oficial en SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 6. Verificación de Aprobación de Quality Gate
      - name: Validar SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
